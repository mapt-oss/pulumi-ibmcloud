version: "2"

linters:
  default: none
  enable:
  - errcheck
  - goconst
  - gosec
  - govet
  - ineffassign
  - lll
  - staticcheck
  - misspell
  - nakedret
  - revive
  - unconvert
  - unused
  exclusions:
    paths:
    - pkg/vendored
    - sdk
    - bin
    - ".*schema\\.go"
    - ".*pulumiManifest\\.go"
    - ".*resources\\.go"

formatters:
  enable:
  - gofmt

run:
  timeout: 20m
